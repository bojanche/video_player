{% extends "videoplayer/base.html" %}
{% block body_block %}

<div class="auth-card card shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 text-center mb-4">Change photo</h1>
        {% if profile.profile_pic %}
            <div class="text-center mb-4">
                <img class="account-photo-preview" src="{{ profile.profile_pic.url }}" alt="{{ user.username }}">
            </div>
        {% endif %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label" for="{{ form.profile_pic.id_for_label }}">{{ form.profile_pic.label }}</label>
                {{ form.profile_pic }}
                {% if form.profile_pic.errors %}
                    <div class="invalid-feedback d-block">{{ form.profile_pic.errors|striptags }}</div>
                {% endif %}
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save photo</button>
                <a class="btn btn-outline-secondary" href="{% url 'videoplayer:video_playlist' %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
