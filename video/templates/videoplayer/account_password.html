{% extends "videoplayer/base.html" %}
{% block body_block %}

<div class="auth-card card shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 text-center mb-4">Edit password</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <div class="form-text">{{ field.help_text }}</div>
                    {% endif %}
                    {% if field.errors %}
                        <div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-primary" type="submit">Save password</button>
                <a class="btn btn-outline-secondary" href="{% url 'videoplayer:video_playlist' %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
