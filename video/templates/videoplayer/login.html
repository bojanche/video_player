{% extends "videoplayer/base.html" %}
{% block body_block %}

<div class="auth-card card shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 text-center mb-4">Sign in</h1>
        {% if login_error %}
            <div class="alert alert-danger" role="alert">
                {{ login_error }}
            </div>
        {% endif %}
        <form method="POST" action="{% url 'user_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" type="text" name="username" placeholder="Enter username" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
    </div>
    <div class="card-footer text-center text-muted small">
        Forgot your password? Contact admin.
    </div>
</div>
{% endblock %}
